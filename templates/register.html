<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MidSport – Créer un compte</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0866ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MidSport">
</head>
<body>
<div id="auth"><div class="w">
  <form class="box" method="post">
    {{ csrf_field() }}
    <b style="font-size:20px">Créer un compte</b>
    <div class="mu" style="margin-bottom:12px">C’est rapide et facile.</div>
    {% for m in get_flashed_messages() %}<div class="er" role="alert">{{ m }}</div>{% endfor %}
    <select name="role" required aria-label="Type de compte">
      <option value="club">Compte Club</option>
      <option value="joueur">Particulier : joueur</option>
      <option value="agent">Particulier : agent</option>
      <option value="coach">Particulier : coach</option>
    </select>
    <input name="name" maxlength="80" placeholder="Nom du club ou prénom et nom" value="{{ request.form.get('name','') }}" required>
    <select name="sport" required aria-label="Sport">
      <option value="football">Football</option>
      <option value="handball">Handball</option>
      <option value="basketball">Basketball</option>
    </select>
    <input name="identifier" type="email" placeholder="Adresse e-mail (un code de validation vous sera envoyé)" autocomplete="username" value="{{ request.form.get('identifier','') }}" required>
    <input name="password" type="password" minlength="8" placeholder="Nouveau mot de passe (8 caractères minimum)" autocomplete="new-password" required>
    <label class="mu" style="display:flex;gap:8px;align-items:flex-start;margin:4px 0 12px"><input type="checkbox" name="terms" value="1" style="width:auto;margin:3px 0 0" required> <span>J’accepte les <a href="{{ url_for('social.conditions') }}" target="_blank" style="color:var(--ac)">conditions d’utilisation</a> et la <a href="{{ url_for('social.confidentialite') }}" target="_blank" style="color:var(--ac)">politique de confidentialité</a>.</span></label>
    <button class="new" style="width:100%;border:0;margin:0">S’inscrire</button>
    <a class="lk" href="{{ url_for('auth.login') }}">Vous avez déjà un compte ?</a>
  </form>
</div></div>
</body>
</html>
